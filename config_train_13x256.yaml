# ============================================================
# 正式训练配置：13 残差块 / 256 滤波器，**从头训练**
#
# 所有参数都由实测决定（2026-10-16 在目标机上跑 benches 得到）：
#
#  1) 自对弈瓶颈在**显卡**，不在 CPU。实测单卡 GPU0：
#       前向批 2  →   875 次模拟/秒，GPU 利用率 83%（空转调度，效率约 2%）
#       前向批 8  →  2540 次模拟/秒
#       前向批 32 →  3710 次模拟/秒（16 workers）/ 7183 次模拟/秒（32 workers）
#     模型空间只有 10×10，批小的时候 GPU 全耗在核函数调度上。**批大小是最关键
#     的参数**：批 2→32 吞吐涨 4.2 倍。用旧配置（批等效为 2）会慢 4 倍以上。
#
#  2) 显存约 1.64 GB/worker（32 workers + 批 32 实测 52.5 GB / 97 GB）。
#     因此 worker 数定在 32：加到 48 约需 79 GB，为 25% 提速冒 OOM 风险不划算
#     ——这是一次几十小时的长跑，稳定性优先。
#
#  3) 后端必须用 "gpu_parallel"：旧的 "gpu" 是单进程 → 只用 1 个核，
#     实测单进程在该模型下只有约 63 次模拟/秒。
#
#  4) 每 cycle 局数 = worker 数 × 每 worker 局数 = 32 × 32 = 1024。
#     这是池「按轮工作」的结构决定的：一轮 = 所有 worker 各跑固定局数后统一
#     回传，为的是喂满前向批、且不在队列里积压用旧策略生成的陈旧样本。
#     因此 cycle 数相应减少到 25，总对局量 25 × 1024 = 25,600 局保持不变。
#
# 预计总时长约 30 小时：自对弈 27.7h + 12 次并行评估 50min + 10 万步训练 1.3h
#
# 用法：
#   PYTHONPATH= python main.py --mode train --config config_train_13x256.yaml
#   建议放在 tmux 里跑，这样关掉笔记本也不影响（详见说明文档）
# ============================================================

# --- 游戏规则 ---
game:
  board_size: 10
  num_amazons: 4

# --- 搜索引擎（训练不使用，仅为兼容配置结构）---
engine:
  type: "alphabeta"                   # 当前比赛用 alpha-beta；MCTS 待训练后再评估
  model_path: "models/best_model.pt"

# --- Alpha-Beta（保底方案，不参与训练）---
alphabeta:
  max_depth: 5
  time_budget_ms: 15000
  use_transposition_table: true
  use_iterative_deepening: true
  use_move_ordering: true
  transposition_table_size: 1048576

# --- MCTS ---
mcts:
  num_simulations: 400                # 400 而非 800：同样算力下对局数翻倍，
                                      # 冷启动阶段"更多对局"比"更深搜索"划算
  c_puct: 1.0
  temperature: 0.0
  self_play_temperature: 1.0          # 自我对弈前 30 步用温度采样
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

# --- 网络：正式规模 ---
network:
  input_channels: 6
  num_residual_blocks: 13
  num_filters: 256
  board_feature_dim: 256
  move_embedding_dim: 128
  hidden_dim: 128
  # 指向**不存在**的路径 → 从头训练。切勿改成 models/best_model.pt：
  # 那是 4块/128 的权重，与 13块/256 不兼容，加载会 size mismatch 崩溃。
  model_path: "models/run13x256_scratch.pt"

# --- 训练 ---
training:
  device: "cuda"
  batch_size: 512
  learning_rate: 0.01                 # 若训练 loss 发散/震荡，优先降这个（0.01 → 0.005）
  momentum: 0.9
  weight_decay: 0.0001
  lr_schedule: "cosine"
  # 总步数 = 25 × 4000 = 10 万，与原计划（100 × 1000）相同，余弦退火曲线不变
  training_steps_per_cycle: 4000
  replay_buffer_capacity: 300000      # 每 cycle 新增约 7.2 万样本 → 约 4 个 cycle 填满
  self_play_games_per_cycle: 1024     # 实际由 池结构决定（见文件头说明）
  eval_games: 64                      # 32 workers × ceil(64/32)=2 → 实际评估 64 局
  eval_num_simulations: 400           # 评估用模拟次数（与 self-play 同口径便于对比）
  eval_win_rate_threshold: 0.55
  num_training_cycles: 25             # 总对局 25 × 1024 = 25,600
  eval_every: 2                       # 12 次评估；并行评估一次约 4 分钟，很便宜
  checkpoint_every: 2                 # 12 份 checkpoint，每份约 124MB
  parallel: false                     # gpu_parallel 自含并行，此项忽略
  num_workers: 0
  self_play_backend: "gpu_parallel"   # 多进程 + GPU（关键，勿改回 "gpu"）
  gpu_batch_size: 32                  # 每 worker 内并发推进的局数 = 前向批大小（最关键参数）
  # GPU1 上有别人的任务（实测 88 GB / 约 80% 利用率，容器外看不到进程），
  # 因此只用 GPU0。若确认 GPU1 空出来了可改成 "0,1"。
  gpu_self_play_devices: "0"
  gpu_self_play_workers: 32           # 实测吞吐 7183 次模拟/秒，显存 52.5 GB
  gpu_games_per_round: 32             # 必须 ≥ gpu_batch_size，否则前向批喂不满
  checkpoint_dir: "models/run13x256"  # 独立目录，不碰原有 checkpoint

# --- 开局库 / 残局库（未启用）---
opening_book:
  enabled: false
  book_path: "src/opening_book/data/opening_book.json"
endgame:
  enabled: false
  tablebase_path: "src/endgame/data/tablebase.pkl"

# --- 日志 ---
logging:
  level: "INFO"
  game_log_enabled: false
  game_log_path: "logs/games/"
  search_stats_enabled: false
