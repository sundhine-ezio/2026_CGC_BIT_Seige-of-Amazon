# ============================================================
# 亚马逊棋博弈系统 - 全局配置文件
# ============================================================

# --- 游戏规则 ---
game:
  board_size: 10
  num_amazons: 4

# --- 搜索引擎选择 ---
engine:
  type: "auto"                  # "auto"（有模型→MCTS，否则 alpha-beta）/ "mcts" / "alphabeta"
  model_path: "models/best_model.pt"

# --- Alpha-Beta 搜索 ---
alphabeta:
  max_depth: 5
  time_budget_ms: 15000
  use_transposition_table: true
  use_iterative_deepening: true
  use_move_ordering: true
  transposition_table_size: 1048576

# --- 局面评估 ---
evaluator:
  type: "heuristic"               # "heuristic"（启发式，快速）或 "monte_carlo"（蒙特卡洛，慢）
  num_simulations: 100            # 仅 monte_carlo 模式使用

# --- MCTS 搜索 (第二阶段) ---
mcts:
  num_simulations: 400
  c_puct: 1.0
  temperature: 0.0
  self_play_temperature: 1.0
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

# --- 深度网络 (第二阶段) ---
network:
  input_channels: 6
  num_residual_blocks: 4
  num_filters: 128
  board_feature_dim: 256
  move_embedding_dim: 128
  hidden_dim: 128
  model_path: "models/best_model.pt"

# --- 训练 (第二阶段) ---
training:
  device: "cuda"                # "cuda" 或 "cpu"
  batch_size: 512
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  lr_schedule: "cosine"
  training_steps_per_cycle: 1000
  replay_buffer_capacity: 300000
  self_play_games_per_cycle: 20
  eval_games: 20
  eval_win_rate_threshold: 0.55
  num_training_cycles: 30
  eval_every: 10
  checkpoint_every: 10
  parallel: true               # 是否用多进程并行自我对弈
  num_workers: 0               # 并行 worker 数（0 = 自动取 CPU 核数）
  self_play_backend: "gpu"     # self-play 后端："gpu"=GPU 批量 MCTS / "cpu"=多进程 CPU 池
  gpu_batch_size: 64           # GPU 批量 self-play 的并发局数（= 每次 GPU 前向 board 数）

# --- 开局库 ---
opening_book:
  enabled: false
  book_path: "src/opening_book/data/opening_book.json"

# --- 残局库 ---
endgame:
  enabled: false
  tablebase_path: "src/endgame/data/tablebase.pkl"
  max_pieces: 3
  max_empty_squares: 15

# --- GUI ---
gui:
  cell_size: 60
  piece_radius: 22
  board_color: "#DEB887"
  default_mode: "HUMAN_VS_AI"

# --- 日志 ---
logging:
  level: "INFO"
  game_log_enabled: true
  game_log_path: "logs/games/"
  search_stats_enabled: true
